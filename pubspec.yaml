name: little_muslim
description: A fun Islamic learning app for kids (6-14) inspired by Duolingo. Learn Quran, Qaida, Salah, Duas & Seerah with games and stories.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  intl: ^0.20.3
  lottie: ^3.1.2
  audioplayers: ^6.1.0
  http: ^1.6.0
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0
  page_transition: ^2.1.0
  smooth_page_indicator: ^1.2.0+3
  flutter_animate: ^4.5.0
  url_launcher: ^6.3.3
  geolocator: ^14.1.1
  timezone: ^0.10.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/audio/
    - assets/audio/letters/
    - assets/audio/duas/
    - assets/l10n/
    - assets/locales/
    - assets/quran/
    - assets/quran/translations/
    - assets/figma/icons/islamic/
    - assets/figma/icons/game/
    - assets/figma/badges/
    - assets/figma/illustrations/islamic/
    - assets/figma/illustrations/map/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
    - family: BalooDa2
      fonts:
        - asset: assets/fonts/BalooDa2-Variable.ttf
